[tool.poetry]
name = "api-gateway"
version = "0.0.1"
description = "Hera Platform - Main API Gateway"
authors = ["Hera Team <team@hera.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.12.0"
asyncpg = ">=0.30.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
httpx = "^0.25.0"
python-dotenv = "^1.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = "^0.0.6"
slowapi = "^0.1.9"
python-dateutil = "^2.8.2"
loguru = "^0.7.2"
email-validator = "^2.3.0"
bcrypt = "3.2.2"
cryptography = "^49.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.62.0"}
prometheus-client = "^0.25.0"
bleach = "^6.4.0"
twilio = "^9.10.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
