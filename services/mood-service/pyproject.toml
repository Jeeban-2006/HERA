[tool.poetry]
name = "mood-service"
version = "0.0.1"
description = "Hera Platform - Mood/Hormone Analysis Microservice"
authors = ["Hera Team <team@hera.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
scikit-learn = "^1.3.0"
numpy = ">=2.1.0"
pandas = ">=2.2.0"
statsmodels = "^0.14.0"
joblib = "^1.3.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
anthropic = "^0.25.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
