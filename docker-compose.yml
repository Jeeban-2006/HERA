services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hera-postgres
    environment:
      POSTGRES_USER: hera_user
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: hera_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hera_user -d hera_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hera-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hera-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: ../../infra/docker/Dockerfile.api-gateway
    container_name: hera-api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hera_user:dev_password_change_me@postgres:5432/hera_dev
      REDIS_URL: redis://redis:6379/0
      PCOD_SERVICE_URL: http://pcod-service:8001
      MOOD_SERVICE_URL: http://mood-service:8002
      SAFETY_SERVICE_URL: http://safety-service:8003
      DEBUG: "true"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
    networks:
      - hera-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PCOD Microservice
  pcod-service:
    build:
      context: ./services/pcod-service
      dockerfile: ../../infra/docker/Dockerfile.pcod-service
    container_name: hera-pcod-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DEBUG: "true"
      ENVIRONMENT: development
      API_GATEWAY_URL: http://api-gateway:8000
    depends_on:
      - api-gateway
    volumes:
      - ./services/pcod-service:/app
      - ./ml/pcod-model:/models
    networks:
      - hera-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Mood Microservice
  mood-service:
    build:
      context: ./services/mood-service
      dockerfile: ../../infra/docker/Dockerfile.mood-service
    container_name: hera-mood-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DEBUG: "true"
      ENVIRONMENT: development
      API_GATEWAY_URL: http://api-gateway:8000
    depends_on:
      - api-gateway
    volumes:
      - ./services/mood-service:/app
      - ./ml/mood-model:/models
    networks:
      - hera-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  # Safety Microservice
  safety-service:
    build:
      context: ./services/safety-service
      dockerfile: ../../infra/docker/Dockerfile.safety-service
    container_name: hera-safety-service
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DEBUG: "true"
      ENVIRONMENT: development
      API_GATEWAY_URL: http://api-gateway:8000
    depends_on:
      - api-gateway
    volumes:
      - ./services/safety-service:/app
      - ./ml/safety-model:/models
    networks:
      - hera-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: hera-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    working_dir: /app/apps/web
    networks:
      - hera-network
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:
  web_node_modules:

networks:
  hera-network:
    driver: bridge
