[tool.poetry]
name = "mood-model"
version = "0.0.1"
description = "Hera Platform - Mood/Time-Series ML Model"
authors = ["Hera Team <team@hera.local>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
scikit-learn = "^1.3.0"
numpy = "^1.24.0"
pandas = "^2.1.0"
statsmodels = "^0.14.0"
joblib = "^1.3.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
jupyter = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
